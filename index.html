<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Ignition Union</title>
  <meta name="description" content="The Ignition Union is a website-building business. Sparking ideas into websites that work.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="The Ignition Union, home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">The Ignition Union</span>
    </a>
    <a class="btn btn-outline btn-small" href="#">Contact</a>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">Website studio</p>
        <h1>The Ignition <span class="accent">Union</span></h1>
        <p class="tagline">Sparking ideas into websites that work.</p>
        <p class="lead">We design and build fast, accessible, professionally crafted websites for businesses that want a strong presence online.</p>
        <div class="actions">
          <a class="btn btn-primary" href="#">Start a project</a>
          <a class="btn btn-outline" href="#">See our work</a>
        </div>
      </div>

      <div class="hero-art" aria-hidden="true">
        <span class="shape shape-red"></span>
        <span class="shape shape-yellow"></span>
        <span class="shape shape-line"></span>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
