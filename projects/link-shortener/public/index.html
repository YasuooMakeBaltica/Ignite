<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shortener</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Shorten a link</h1>
    <form id="form">
      <input id="url" type="url" placeholder="https://a-very-long-link.com/with/a/path" required autocomplete="off">
      <input id="alias" type="text" placeholder="custom name (optional)" maxlength="32" autocomplete="off">
      <button type="submit">Shorten</button>
    </form>
    <p id="msg" role="status"></p>
    <h2>Your links</h2>
    <ul id="list"></ul>
    <p id="empty">No links yet. Make your first one above.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
